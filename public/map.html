<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍚 망원밥 — 탐험 지도</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Pretendard', sans-serif; }
  #app { display: flex; height: 100vh; height: 100dvh; }
  #sidebar {
    width: 320px; min-width: 320px; background: #fafaf7; border-right: 1px solid #e5e5e5;
    display: flex; flex-direction: column;
  }
  #sidebar header { padding: 16px; border-bottom: 1px solid #e5e5e5; position: relative; min-width: 0; }
  #sidebar header h1 { margin: 0; font-size: 18px; }
  #sidebar header .stat { font-size: 13px; color: #666; margin-top: 4px; }
  #sidebar header .who { font-size: 12px; color: #10b981; margin-top: 4px; font-weight: 600; }
  #badges { display: none; }
  #badges::-webkit-scrollbar { display: none; }
  .badge-chip {
    flex: 0 0 auto; padding: 3px 8px; font-size: 11px;
    background: #fef3c7; color: #92400e; border-radius: 999px;
    white-space: nowrap; cursor: default;
  }
  #sidebar .toggle { display: none; }
  #search { width: 100%; padding: 8px 10px; margin-top: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
  #presets {
    display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px;
  }
  #presets button {
    padding: 5px 10px; font-size: 12px;
    background: #fff; border: 1px solid #ddd; border-radius: 999px;
    cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  #presets button.active { background: #10b981; color: #fff; border-color: #10b981; }
  #cats {
    display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;
  }
  #cats button {
    padding: 4px 9px; font-size: 11px;
    background: #f3f4f6; border: 1px solid transparent; border-radius: 999px;
    cursor: pointer; white-space: nowrap;
  }
  #cats button.active { background: #fef3c7; border-color: #f59e0b; color: #92400e; font-weight: 600; }
  #section-label {
    padding: 8px 16px 4px; font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.5px;
  }
  #list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .item {
    padding: 12px 16px; border-bottom: 1px solid #eee; cursor: pointer;
    transition: background 0.15s;
  }
  .item:hover { background: #f0efe8; }
  .item.active { background: #e8f5e9; }
  .item .row1 { display: flex; align-items: center; gap: 6px; }
  .item .emoji { font-size: 16px; flex: 0 0 auto; }
  .item .name { font-weight: 600; font-size: 14px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .stats { font-size: 11px; color: #666; flex: 0 0 auto; white-space: nowrap; }
  .item .stats .star { color: #f59e0b; font-weight: 600; }
  .item .stats .hot { color: #dc2626; }
  .item .stats .me { color: #10b981; }
  .item .meta { font-size: 12px; color: #888; margin-top: 2px; padding-left: 22px; }
  .item .status { font-size: 11px; margin-top: 4px; padding-left: 22px; }
  .item .status.disc { color: #f59e0b; }
  .item .status.unk { color: #94a3b8; }
  #map { flex: 1; }
  footer {
    padding: 8px 16px; border-top: 1px solid #e5e5e5; font-size: 11px; color: #999;
    background: #fff; text-align: center;
  }
  .empty { padding: 30px; text-align: center; color: #999; }

  /* InfoWindow 안의 액션 버튼 */
  .iw { padding: 12px; font-size: 13px; min-width: 220px; line-height: 1.5; }
  .iw .title { font-weight: 600; font-size: 14px; }
  .iw .meta { color: #666; font-size: 12px; }
  .iw .badge { display: inline-block; padding: 1px 6px; margin-left: 4px; border-radius: 4px;
    font-size: 10px; font-weight: 600; vertical-align: middle; }
  .iw .badge.hot { background: #fee2e2; color: #dc2626; }
  .iw .badge.star { background: #fef3c7; color: #d97706; }
  .iw .actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .iw .review-quote {
    margin-top: 8px; padding: 8px 10px; background: #fffaf0;
    border-left: 3px solid #f59e0b; border-radius: 4px;
    font-size: 12px; line-height: 1.5; color: #555;
  }
  .iw .review-quote .who { color: #888; font-size: 11px; margin-top: 2px; display: block; }
  .iw .review-more {
    display: inline-block; margin-top: 6px; font-size: 11px; color: #3b82f6;
    cursor: pointer; text-decoration: underline;
  }
  .iw .review-list { margin-top: 8px; max-height: 200px; overflow-y: auto; }
  .iw .review-item {
    padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 12px; line-height: 1.5;
  }
  .iw .review-item:last-child { border-bottom: none; }
  .iw .review-item .stars { color: #f59e0b; }
  .iw .review-item .who { color: #888; font-size: 11px; }
  .iw .review-item .tags { color: #94a3b8; font-size: 11px; margin-left: 4px; }
  .iw .meetups { margin-top: 8px; padding: 8px 10px; background: #ecfdf5;
    border-left: 3px solid #10b981; border-radius: 4px; }
  .iw .meetup-item { font-size: 12px; line-height: 1.5; padding: 3px 0; display: flex;
    justify-content: space-between; align-items: center; gap: 6px; }
  .iw .meetup-item:not(:last-child) { border-bottom: 1px dashed #d1fae5; padding-bottom: 6px; margin-bottom: 4px; }
  .iw .meetup-item .info { flex: 1; min-width: 0; }
  .iw .meetup-item button { padding: 3px 8px; font-size: 11px; flex: 0 0 auto; }
  .iw .nearby { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ddd; }
  .time-options { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .time-options button {
    flex: 0 0 auto; padding: 6px 12px; border: 1px solid #ddd; background: #fff;
    border-radius: 999px; cursor: pointer; font-size: 13px;
  }
  .time-options button.selected { background: #10b981; color: #fff; border-color: #10b981; }
  .time-options button.disabled { opacity: 0.4; cursor: not-allowed; }
  .iw .nearby-title { font-size: 11px; color: #888; margin-bottom: 4px; }
  .iw .nearby-item {
    display: inline-block; padding: 3px 8px; margin: 2px 3px 2px 0;
    background: #f3f4f6; border-radius: 12px; font-size: 11px;
    cursor: pointer; color: #333; text-decoration: none;
  }
  .iw .nearby-item:hover { background: #e5e7eb; }
  .iw button, .iw a.btn {
    padding: 5px 9px; font-size: 12px; border: 1px solid #ddd;
    background: #fff; border-radius: 4px; cursor: pointer; text-decoration: none; color: #333;
  }
  .iw button.primary { background: #10b981; color: #fff; border-color: #10b981; }
  .iw button.danger { background: #fff; color: #dc2626; border-color: #fecaca; }
  .iw button:hover { opacity: 0.85; }
  .iw .toast { margin-top: 6px; font-size: 12px; color: #10b981; }

  /* 리뷰 모달 */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
    display: none; align-items: center; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #fff; padding: 24px; border-radius: 12px;
    width: 90%; max-width: 400px;
  }
  .modal h2 { margin: 0 0 12px; font-size: 18px; }
  .modal label { display: block; font-size: 13px; margin-top: 12px; color: #555; }
  .modal .stars { display: inline-flex; gap: 0; font-size: 32px; cursor: pointer; user-select: none; line-height: 1; letter-spacing: -0.05em; }
  .modal .stars span { opacity: 0.25; transition: opacity 0.1s; padding: 0; color: #f59e0b; }
  .modal .stars span.on { opacity: 1; }
  .modal textarea {
    width: 100%; min-height: 70px; padding: 8px; margin-top: 6px;
    border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 13px;
  }
  .modal .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .modal .tags label {
    margin-top: 0; padding: 4px 10px; border: 1px solid #ddd; border-radius: 999px;
    cursor: pointer; font-size: 12px; user-select: none;
  }
  .modal .tags input { display: none; }
  .modal .tags input:checked + span { color: #10b981; font-weight: 600; }
  .modal .actions { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
  .modal button {
    padding: 8px 14px; border: 1px solid #ddd; background: #fff;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .modal button.primary { background: #10b981; color: #fff; border-color: #10b981; }

  /* ─── 모바일 (≤768px) ─── */
  @media (max-width: 768px) {
    #presets button { padding: 6px 11px; font-size: 13px; }
    #cats button { padding: 5px 10px; font-size: 12px; }
    #app { flex-direction: column; }
    #map { flex: 1; min-height: 0; order: 1; }
    #sidebar {
      position: fixed; left: 0; right: 0; bottom: 0;
      width: 100%; min-width: 0;
      max-height: 75vh; max-height: 75dvh;
      border-right: none;
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
      transform: translateY(calc(100% - 110px));
      transition: transform 0.28s ease-out;
      z-index: 100;
    }
    #sidebar.expanded { transform: translateY(0); }
    #sidebar header { padding: 14px 16px 10px; cursor: pointer; user-select: none; }
    #sidebar header::before {
      content: ''; display: block; width: 36px; height: 4px;
      background: #d1d5db; border-radius: 2px;
      margin: -4px auto 8px;
    }
    #sidebar header h1 { font-size: 16px; }
    #search { font-size: 16px; /* iOS 자동 확대 방지 */ }
    #list { padding-bottom: 16px; }
    .item { padding: 14px 16px; }

    .iw { min-width: 0; max-width: 240px; padding: 10px; }
    .iw .actions button, .iw .actions a.btn { padding: 8px 10px; font-size: 13px; }

    .modal-bg { align-items: flex-end; }
    .modal {
      width: 100%; max-width: 100%;
      border-radius: 16px 16px 0 0;
      padding: 20px 16px 24px;
    }
    .modal .stars { font-size: 32px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h1 style="margin:0">🍚 망원밥 탐험 지도</h1>
        <button id="addBtn" onclick="openAddModal()" title="식당 추가"
          style="padding:6px 10px;font-size:13px;background:#10b981;color:#fff;border:none;border-radius:6px;cursor:pointer;flex:0 0 auto">
          ➕ 추가
        </button>
      </div>
      <div class="stat" id="stat">불러오는 중…</div>
      <div class="who" id="who"></div>
      <div id="badges"></div>
      <input id="search" type="text" placeholder="🔍 식당 / 카테고리 검색">
      <div id="presets">
        <button class="active" data-preset="near">📍 가까운 순</button>
        <button data-preset="popular">🔥 핫플</button>
        <button data-preset="rating">⭐ 평점</button>
        <button data-preset="my">👑 내 단골</button>
        <button data-preset="favorite">⭐ 즐겨찾기</button>
        <button data-preset="myreviews">📝 내 리뷰</button>
        <button data-preset="unvisited">🌫️ 미탐험</button>
        <button data-preset="hidden">⛔ 퇴출됨</button>
      </div>
      <div id="cats"></div>
    </header>
    <div id="section-label" hidden></div>
    <div id="list"><div class="empty">로딩 중…</div></div>
    <footer>🌿 by 몬스테라하우스</footer>
  </aside>
  <div id="map"></div>
</div>

<!-- 식당 수동 추가 모달 -->
<div class="modal-bg" id="addModal">
  <div class="modal" style="max-width:440px">
    <h2>➕ 식당 추가</h2>
    <input id="addSearch" type="text" placeholder="식당 이름으로 카카오에서 검색…"
      style="width:100%;padding:10px;margin-top:8px;border:1px solid #ddd;border-radius:6px;font-size:14px">
    <div id="addResults" style="margin-top:12px;max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch"></div>
    <div class="actions"><button onclick="closeAddModal()">닫기</button></div>
  </div>
</div>
<style>
  .add-item { display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:10px 4px; border-bottom:1px solid #eee; }
  .add-item:last-child { border-bottom:none; }
  .add-item .info { flex:1; min-width:0; }
  .add-item .info .name { font-weight:600; font-size:14px; }
  .add-item .info .meta { font-size:11px; color:#666; margin-top:2px; }
  .add-item button { flex:0 0 auto; padding:6px 12px; font-size:12px; border-radius:6px;
    border:1px solid #10b981; background:#fff; color:#10b981; cursor:pointer; }
  .add-item button.primary { background:#10b981; color:#fff; }
</style>

<!-- 점심 모집 생성 모달 -->
<div class="modal-bg" id="meetupModal">
  <div class="modal">
    <h2 id="meetupTitle">🍽️ 같이 가요</h2>
    <label>약속 시간</label>
    <div class="time-options" id="timeOptions">
      <button data-time="11:30">오늘 11:30</button>
      <button data-time="12:00">오늘 12:00</button>
      <button data-time="12:30">오늘 12:30</button>
      <button data-time="13:00">오늘 13:00</button>
      <button data-time="custom">직접 입력</button>
    </div>
    <input type="datetime-local" id="meetupTimeCustom" style="margin-top:8px;width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;display:none">
    <label>한마디 (선택)</label>
    <textarea id="meetupNote" placeholder="점심특선 노려봅니다 / 빨리 먹고 와야 해요 등"></textarea>
    <div class="actions">
      <button onclick="closeMeetupModal()">취소</button>
      <button class="primary" onclick="submitMeetup()">모집 시작 🚀</button>
    </div>
  </div>
</div>

<!-- 리뷰 작성 모달 -->
<div class="modal-bg" id="reviewModal">
  <div class="modal">
    <h2 id="reviewTitle">리뷰 작성</h2>
    <label>별점</label>
    <div class="stars" id="stars"><span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span></div>
    <label>한 줄 코멘트 (선택)</label>
    <textarea id="reviewComment" placeholder="국물이 진해요, 점심 특선 추천 등"></textarea>
    <label>태그 (선택)</label>
    <div class="tags" id="reviewTags">
      <label><input type="checkbox" value="#혼밥"><span>#혼밥</span></label>
      <label><input type="checkbox" value="#단체"><span>#단체</span></label>
      <label><input type="checkbox" value="#웨이팅"><span>#웨이팅</span></label>
      <label><input type="checkbox" value="#가성비"><span>#가성비</span></label>
      <label><input type="checkbox" value="#빠름"><span>#빠름</span></label>
    </div>
    <div class="actions">
      <button onclick="closeReview()">취소</button>
      <button class="primary" onclick="submitReview()">제출</button>
    </div>
  </div>
</div>

<script>
function showError(msg) {
  document.getElementById('list').innerHTML =
    `<div class="empty" style="color:#dc2626;text-align:left;font-size:13px;line-height:1.6">
      <strong>❌ 지도 로드 실패</strong><br><br>${msg}
    </div>`;
  document.getElementById('stat').textContent = '';
}
</script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=__KAKAO_JS_KEY__&autoload=false"
        onerror="showError('카카오 SDK 로드 실패. KAKAO_JS_API_KEY 환경변수와 카카오 앱 도메인 등록 확인.')"></script>
<script>
const OFFICE = { y: 37.5548733, x: 126.9094692 };
const params = new URLSearchParams(location.search);
const USER = {
  id: params.get('user') || '',
  name: params.get('name') || '',
  channel: params.get('channel') || '',
};
let map, markers = [], infos = [], restaurants = [], openInfo = null, routeLine = null;
let reviewTarget = null, reviewRating = 0;
let meetupTarget = null, meetupSelectedTime = null;
let currentPreset = 'near', currentCat = null;

if (USER.id) {
  document.getElementById('who').textContent = `🥾 ${USER.name || USER.id} 으로 체크인`;
} else {
  document.getElementById('who').textContent = '⚠️ 슬랙 /밥 지도 로 열어야 체크인 가능';
}

if (typeof kakao === 'undefined') {
  showError('카카오 SDK가 차단됐거나 키가 잘못됐습니다.<br>' +
    '• KAKAO_JS_API_KEY가 <strong>JavaScript 키</strong>인지 확인<br>' +
    '• 카카오 디벨로퍼스 → 플랫폼 → Web에 도메인 등록 확인');
} else {
  kakao.maps.load(async () => {
    map = new kakao.maps.Map(document.getElementById('map'), {
      center: new kakao.maps.LatLng(OFFICE.y, OFFICE.x),
      level: 4,
    });

    new kakao.maps.Marker({
      position: new kakao.maps.LatLng(OFFICE.y, OFFICE.x),
      map,
      image: makeMarker({ color: '#10b981', size: 36, emoji: '🏢', glow: false, ring: null }),
      title: '몬스테라하우스',
      zIndex: 8,
    });

    new kakao.maps.Circle({
      center: new kakao.maps.LatLng(OFFICE.y, OFFICE.x),
      radius: 500,
      strokeWeight: 1, strokeColor: '#10b981', strokeOpacity: 0.4,
      fillColor: '#10b981', fillOpacity: 0.05,
    }).setMap(map);

    // 지도 빈 곳 클릭 시 InfoWindow + 경로선 닫기
    kakao.maps.event.addListener(map, 'click', () => {
      if (openInfo) { openInfo.close(); openInfo = null; }
      clearRoute();
      document.querySelectorAll('#list .item.active').forEach(el => el.classList.remove('active'));
    });

    await loadRestaurants();
    document.getElementById('search').addEventListener('input', renderAll);
  });
}

let hiddenRestaurants = [];

async function loadRestaurants() {
  const url = USER.id ? `/api/restaurants?user=${encodeURIComponent(USER.id)}` : '/api/restaurants';
  const [restRes, meetRes, hiddenRes] = await Promise.all([
    fetch(url),
    fetch('/api/meetups'),
    fetch('/api/hidden'),
  ]);
  restaurants = await restRes.json();
  const meetups = await meetRes.json();
  hiddenRestaurants = await hiddenRes.json();
  // 식당별 활성 모집 머지
  const grouped = {};
  for (const m of meetups) {
    (grouped[m.restaurant_id] = grouped[m.restaurant_id] || []).push(m);
  }
  for (const r of restaurants) {
    r.meetups = grouped[r.id] || [];
  }
  renderCatChips();
  renderAll();
}

// 카테고리 버킷팅 (이모지 매핑과 일치)
function categoryBucket(cat) {
  cat = cat || '';
  if (/한식|국밥|국수|찌개|찜|족발|보쌈|쌈/.test(cat)) return '한식';
  if (/일식|초밥|스시|라멘|돈까스|우동|텐동/.test(cat)) return '일식';
  if (/중식|짜장|마라/.test(cat)) return '중식';
  if (/양식|파스타|피자|버거|스테이크|이탈리|프렌치/.test(cat)) return '양식';
  if (/카페|커피|디저트|베이커리|빵|티/.test(cat)) return '카페';
  if (/술집|호프|바|이자카야|와인|맥주/.test(cat)) return '술집';
  if (/분식|떡볶이|김밥/.test(cat)) return '분식';
  if (/치킨/.test(cat)) return '치킨';
  if (/고기|구이|곱창/.test(cat)) return '고기';
  if (/아시아|쌀국수|태국|베트남/.test(cat)) return '아시아';
  return '기타';
}

const BUCKET_EMOJI = {
  '한식': '🍚', '일식': '🍣', '중식': '🥢', '양식': '🍕', '카페': '☕',
  '술집': '🍺', '분식': '🌶️', '치킨': '🍗', '고기': '🥩', '아시아': '🍜', '기타': '🍴',
};

// 카테고리 칩 동적 생성 (식당 수 많은 순)
function renderCatChips() {
  const counts = {};
  restaurants.forEach(r => {
    const b = categoryBucket(r.category);
    counts[b] = (counts[b] || 0) + 1;
  });
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const el = document.getElementById('cats');
  el.innerHTML = sorted.map(([cat, n]) =>
    `<button data-cat="${cat}" class="${currentCat === cat ? 'active' : ''}">
      ${BUCKET_EMOJI[cat] || ''} ${cat} ${n}</button>`
  ).join('');
  el.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      currentCat = currentCat === b.dataset.cat ? null : b.dataset.cat;
      renderCatChips();
      renderAll();
    });
  });
}

function applyPreset(list, preset) {
  switch (preset) {
    case 'popular':
      return list
        .filter(r => (r.visit_count || 0) > 0)
        .sort((a, b) => (b.visit_count || 0) - (a.visit_count || 0));
    case 'rating':
      return list
        .filter(r => r.avg_rating)
        .sort((a, b) => parseFloat(b.avg_rating) - parseFloat(a.avg_rating));
    case 'my':
      return list
        .filter(r => (r.my_visit_count || 0) > 0)
        .sort((a, b) => (b.my_visit_count || 0) - (a.my_visit_count || 0));
    case 'favorite':
      return list
        .filter(r => r.is_favorite)
        .sort((a, b) => (a.distance_from_office || 0) - (b.distance_from_office || 0));
    case 'myreviews':
      return list
        .filter(r => r.my_review)
        .sort((a, b) => new Date(b.my_review.created_at) - new Date(a.my_review.created_at));
    case 'unvisited':
      return list
        .filter(r => !r.visited_by_me)
        .sort((a, b) => (a.distance_from_office || 0) - (b.distance_from_office || 0));
    case 'hidden':
      // 별도 데이터 (퇴출된 식당) — 외부에서 처리
      return [];
    case 'near':
    default:
      return [...list].sort((a, b) => (a.distance_from_office || 0) - (b.distance_from_office || 0));
  }
}

const PRESET_LABEL = {
  near: null,
  popular: '🔥 동료들이 자주 가는 곳',
  rating: '⭐ 평점이 높은 곳',
  my: '👑 내가 자주 가는 단골',
  favorite: '⭐ 내 즐겨찾기',
  myreviews: '📝 내가 쓴 리뷰',
  unvisited: '🌫️ 아직 안 가본 곳',
  hidden: '⛔ 퇴출된 식당 (복구 가능)',
};

function renderAll() {
  // 퇴출됨 모드 — 별도 처리 (지도엔 안 그리고, 사이드바 리스트만)
  if (currentPreset === 'hidden') {
    markers.forEach(m => m.setMap(null));
    markers = []; infos = [];
    renderHiddenList();
    return;
  }

  const q = (document.getElementById('search').value || '').toLowerCase();
  let filtered = restaurants.filter(r => {
    if (q && !r.name.toLowerCase().includes(q) && !(r.category || '').toLowerCase().includes(q)) return false;
    if (currentCat && categoryBucket(r.category) !== currentCat) return false;
    return true;
  });
  filtered = applyPreset(filtered, currentPreset);

  markers.forEach(m => m.setMap(null));
  markers = []; infos = [];

  filtered.forEach((r, idx) => {
    const style = getMarkerStyle(r);
    const marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(r.latitude, r.longitude),
      map,
      image: makeMarker(style),
      title: r.name,
      // 1~10 범위 — InfoWindow(999)보다 항상 낮게
      zIndex: Math.floor(style.size / 5),
    });
    const info = new kakao.maps.InfoWindow({
      content: buildInfoContent(r),
      removable: true,
      zIndex: 999,
    });
    kakao.maps.event.addListener(marker, 'click', () => openMarker(idx));
    markers.push(marker); infos.push(info);
  });

  // 섹션 라벨
  const labelEl = document.getElementById('section-label');
  const presetLabel = PRESET_LABEL[currentPreset];
  if (presetLabel) {
    labelEl.textContent = `${presetLabel} · ${filtered.length}곳`;
    labelEl.hidden = false;
  } else {
    labelEl.hidden = true;
  }

  const list = document.getElementById('list');
  if (!filtered.length) {
    const msg = currentPreset === 'my' ? '아직 단골이 없어요' :
                currentPreset === 'favorite' ? '즐겨찾기한 식당이 없어요. ☆ 별을 눌러 추가하세요' :
                currentPreset === 'myreviews' ? '아직 작성한 리뷰가 없어요' :
                currentPreset === 'unvisited' ? '모든 곳을 탐험했네요! 🎉' :
                currentPreset === 'rating' ? '아직 리뷰가 없어요' :
                currentPreset === 'popular' ? '아직 방문 기록이 없어요' :
                '검색 결과 없음';
    list.innerHTML = `<div class="empty">${msg}</div>`;
  } else {
    list.innerHTML = filtered.map((r, idx) => {
      const visits = r.visit_count || 0;
      const myCount = r.my_visit_count || 0;
      const rating = r.avg_rating ? `<span class="star">⭐${r.avg_rating}</span>` : '';
      const hot = visits >= 5 ? `<span class="hot">🔥${visits}</span>` : '';
      const me = myCount > 0 ? `<span class="me">👑${myCount}</span>` : '';
      const stats = [rating, hot, me].filter(Boolean).join(' ');
      const status = r.discovered
        ? `<span class="status disc">✅ 탐험 완료${visits ? ' · 총 ' + visits + '회' : ''}</span>`
        : `<span class="status unk">🌫️ 미탐험</span>`;
      return `<div class="item" data-idx="${idx}">
        <div class="row1">
          <span class="emoji">${categoryEmoji(r.category)}</span>
          <span class="name">${esc(r.name)}</span>
          <span class="stats">${stats}</span>
        </div>
        <div class="meta">${esc(r.category || '')} · ${formatDist(r.distance_from_office)}</div>
        ${status}
      </div>`;
    }).join('');
    list.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx, 10);
        const r = filtered[idx];
        map.panTo(new kakao.maps.LatLng(r.latitude, r.longitude));
        openMarker(idx);
      });
    });
  }

  window._filtered = filtered;

  const total = restaurants.length;
  const disc = restaurants.filter(r => r.discovered).length;
  const filterNote = (q || currentCat || currentPreset !== 'near')
    ? ` (보이는 ${filtered.length}곳)` : '';
  document.getElementById('stat').textContent =
    `🗺️ 전체 ${disc} / ${total}곳 탐험 완료${filterNote}`;
}

document.querySelectorAll('#presets button').forEach(b => {
  b.addEventListener('click', () => {
    currentPreset = b.dataset.preset;
    document.querySelectorAll('#presets button').forEach(x => x.classList.toggle('active', x === b));
    renderAll();

function openMarker(idx) {
  if (openInfo) openInfo.close();
  infos[idx].open(map, markers[idx]);
  if (typeof infos[idx].setZIndex === 'function') infos[idx].setZIndex(999);
  openInfo = infos[idx];
  const list = window._filtered || restaurants;
  const r = list[idx];
  if (r) {
    window._lastRestaurantId = r.id;
    drawRoute(r);
  }
  document.querySelectorAll('#list .item').forEach((el, i) => {
    el.classList.toggle('active', parseInt(el.dataset.idx, 10) === idx);
  });
  const target = document.querySelector(`#list .item[data-idx="${idx}"]`);
  if (target) target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function buildInfoContent(r) {
  const isDisc = r.discovered;
  const ratingLine = r.avg_rating
    ? `⭐ ${r.avg_rating} · ${r.visit_count}회 방문`
    : '🌫️ 아직 미탐험';
  const canAct = !!USER.id;
  const visitLabel = isDisc ? '또 갔어요 +1' : '나 가봤어! 🥾';

  // 인기/평점 뱃지
  const visits = r.visit_count || 0;
  const rating = parseFloat(r.avg_rating) || 0;
  const badges = [
    visits >= 10 ? '<span class="badge hot">🔥 HOT</span>' : '',
    rating >= 4.5 ? '<span class="badge star">⭐ 4.5+</span>' : '',
  ].join('');

  // 즐겨찾기 별
  const favStar = canAct
    ? `<span style="cursor:pointer;font-size:18px;margin-left:4px"
         onclick="toggleFavorite(${r.id}, this)"
         title="${r.is_favorite ? '즐겨찾기 해제' : '즐겨찾기 추가'}">${r.is_favorite ? '⭐' : '☆'}</span>`
    : '';

  // 내 리뷰 (있으면 표시)
  const myReviewLine = r.my_review
    ? `<div class="review-quote" style="background:#eef2ff;border-left-color:#6366f1">
         📝 <strong>내 리뷰</strong> ${'⭐'.repeat(r.my_review.rating || 0)}
         ${r.my_review.comment ? `<br>"${esc(r.my_review.comment)}"` : ''}
       </div>` : '';

  // 본인 방문 카운트
  const myCount = r.my_visit_count || 0;
  const meLine = myCount > 0
    ? `<div class="meta" style="color:#10b981">🥾 내가 ${myCount}회 방문</div>` : '';

  // 샘플 리뷰 인용 (랜덤 1개) + 더 보기
  let reviewQuote = '';
  const reviewCount = r.review_count || 0;
  if (r.sample_review && r.sample_review.comment) {
    const sr = r.sample_review;
    const stars = '⭐'.repeat(sr.rating || 0);
    reviewQuote = `<div class="review-quote">
      💬 "${esc(sr.comment)}"
      <span class="who">${stars} — ${esc(sr.user_name || '익명')}</span>
    </div>`;
  }
  const moreLink = reviewCount > (r.sample_review ? 1 : 0)
    ? `<a class="review-more" onclick="showAllReviews(${r.id})">리뷰 ${reviewCount}개 모두 보기</a>` : '';
  const reviewsContainer = `<div id="reviews-${r.id}"></div>`;

  // 같은 위치(15m 이내) 다른 가게
  const nearby = restaurants.filter(o =>
    o.id !== r.id &&
    haversineMeters(r.latitude, r.longitude, o.latitude, o.longitude) < 15
  );
  const nearbyHtml = nearby.length ? `
    <div class="nearby">
      <div class="nearby-title">📍 같은 위치 다른 가게 (${nearby.length})</div>
      ${nearby.map(n => `<a class="nearby-item" onclick="selectById(${n.id})">${esc(n.name)}</a>`).join('')}
    </div>` : '';

  // 리뷰 버튼 — 체크인한 사람만, 기존 리뷰 있으면 수정
  let reviewBtn = '';
  if (canAct && r.visited_by_me) {
    const label = r.my_review ? '리뷰 수정 ✏️' : '리뷰 작성 ✍️';
    reviewBtn = `<button onclick="openReview(${r.id}, '${esc(r.name).replace(/'/g, "\\'")}')">${label}</button>`;
  }

  // 체크인 취소 버튼 — 본인 방문이 있을 때만
  const cancelBtn = canAct && myCount > 0
    ? `<button onclick="cancelVisit(${r.id}, this)">취소 ↩</button>` : '';

  // 활성 모집 (있으면 InfoWindow 상단에 표시)
  const meetups = r.meetups || [];
  const meetupsHtml = meetups.length ? `
    <div class="meetups">
      ${meetups.map(m => {
        const joined = m.participant_ids && m.participant_ids.includes(USER.id);
        const btn = !canAct ? '' : (joined
          ? `<button onclick="leaveMeetup(${m.id}, this)">나갈래</button>`
          : `<button class="primary" onclick="joinMeetup(${m.id}, this)">참여</button>`);
        return `<div class="meetup-item">
          <div class="info">🍽️ <strong>${formatMeetTime(m.meet_at)}</strong>
            ${esc(m.organizer_name || '익명')} 모집 (${m.participant_count}명)
            ${m.note ? `<div style="font-size:11px;color:#666;margin-top:2px">"${esc(m.note)}"</div>` : ''}
          </div>
          ${btn}
        </div>`;
      }).join('')}
    </div>` : '';

  // 같이 가요 버튼
  const meetupBtn = canAct
    ? `<button onclick="openMeetupModal(${r.id}, '${esc(r.name).replace(/'/g, "\\'")}')">🍽️ 같이 가요</button>`
    : '';

  return `<div class="iw">
    <div class="title">${categoryEmoji(r.category)} ${esc(r.name)}${badges}${favStar}</div>
    <div class="meta">${esc(r.category || '')} · ${formatDist(r.distance_from_office)}</div>
    <div class="meta">${ratingLine}</div>
    ${meLine}
    ${meetupsHtml}
    <div class="actions">
      ${canAct ? `<button class="primary" onclick="visit(${r.id}, this)">${visitLabel}</button>` : ''}
      ${cancelBtn}
      ${reviewBtn}
      ${meetupBtn}
      <a class="btn" href="${kakaoDirectionsUrl(r)}" target="_blank">🚶 길찾기</a>
      <a class="btn" href="${r.kakao_url}" target="_blank">카카오맵 →</a>
      ${canAct ? `<button class="danger" onclick="hideRestaurant(${r.id}, this)">⛔ 퇴출</button>` : ''}
    </div>
    <div class="toast" id="toast-${r.id}"></div>
    ${myReviewLine}
    ${reviewQuote}
    ${moreLink}
    ${reviewsContainer}
    ${nearbyHtml}
  </div>`;
}

// 퇴출된 식당 리스트 렌더링
function renderHiddenList() {
  const labelEl = document.getElementById('section-label');
  labelEl.textContent = `${PRESET_LABEL.hidden} · ${hiddenRestaurants.length}곳`;
  labelEl.hidden = false;
  const list = document.getElementById('list');
  if (!hiddenRestaurants.length) {
    list.innerHTML = '<div class="empty">퇴출된 식당이 없어요</div>';
  } else {
    list.innerHTML = hiddenRestaurants.map(r => `
      <div class="item" style="opacity:0.7">
        <div class="row1">
          <span class="emoji">${categoryEmoji(r.category)}</span>
          <span class="name">${esc(r.name)}</span>
          <button onclick="unhideRestaurant(${r.id}, this)"
            style="padding:3px 8px;font-size:11px;border:1px solid #10b981;background:#fff;color:#10b981;border-radius:4px;cursor:pointer">
            복구
          </button>
        </div>
        <div class="meta">${esc(r.category || '')} · ${formatDist(r.distance_from_office)}</div>
        <div class="status unk">⛔ 퇴출됨</div>
      </div>
    `).join('');
  }
  document.getElementById('stat').textContent = `⛔ 퇴출 ${hiddenRestaurants.length}곳`;
}

async function unhideRestaurant(restaurantId, btn) {
  btn.disabled = true;
  btn.textContent = '복구 중…';
  try {
    const res = await fetch('/api/unhide', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ restaurantId }),
    });
    if (!res.ok) throw new Error((await res.json()).error || '실패');
    await loadRestaurants();
  } catch (e) { btn.disabled = false; btn.textContent = '복구'; alert('실패: ' + e.message); }
}

// 즐겨찾기 토글
async function toggleFavorite(restaurantId, btn) {
  if (!USER.id) return;
  btn.disabled = true;
  try {
    const res = await fetch('/api/favorite', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ restaurantId, userId: USER.id }),
    });
    if (!res.ok) throw new Error((await res.json()).error || '실패');
    const id = window._lastRestaurantId;
    await loadRestaurants();
    if (id) reopenById(id);
  } catch (e) { btn.disabled = false; alert('실패: ' + e.message); }
}

let _addSearchTimer;
document.getElementById('addSearch').addEventListener('input', e => {
  clearTimeout(_addSearchTimer);

  const target = document.getElementById('addResults');
  if (q.length < 2) {
    target.innerHTML = '<div class="empty" style="font-size:12px;color:#888;padding:20px 0;text-align:center">2글자 이상 입력</div>';
    return;
  }
  _addSearchTimer = setTimeout(() => searchKakaoFood(q), 300);
});

async function searchKakaoFood(q) {
  const target = document.getElementById('addResults');
  target.innerHTML = '<div class="empty" style="font-size:12px;color:#888;padding:20px 0;text-align:center">검색 중…</div>';
  try {
    const res = await fetch('/api/kakao/search?q=' + encodeURIComponent(q));
    const docs = await res.json();
    if (!docs.length) {
      target.innerHTML = '<div class="empty" style="font-size:12px;color:#888;padding:20px 0;text-align:center">결과 없음 (반경 2km 내)</div>';
      return;
    }
    const existing = new Set(restaurants.concat(hiddenRestaurants).map(r => String(r.kakao_place_id)));
    target.innerHTML = docs.map(d => {
      const isExisting = existing.has(String(d.id));
      const docJson = JSON.stringify(d).replace(/"/g, '&quot;');
      return `<div class="add-item">
        <div class="info">
          <div class="name">${esc(d.place_name)}</div>
          <div class="meta">${esc(d.category_name || '')}</div>
          <div class="meta">${esc(d.address_name || '')} · ${d.distance ? Math.round(d.distance) + 'm' : ''}</div>
        </div>
        ${isExisting
          ? '<span style="font-size:11px;color:#888">이미 있음</span>'
          : `<button class="primary" data-doc="${docJson}" onclick="addKakaoDoc(this)">추가</button>`}
      </div>`;
    }).join('');
  } catch {
    target.innerHTML = '<div class="empty" style="color:#dc2626;padding:20px 0;text-align:center">검색 실패</div>';
  }
}

async function addKakaoDoc(btn) {
  const doc = JSON.parse(btn.dataset.doc.replace(/&quot;/g, '"'));
  btn.disabled = true;
  btn.textContent = '추가 중…';
  try {
    const res = await fetch('/api/restaurants', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(doc),
    });
    if (!res.ok) throw new Error((await res.json()).error || '실패');
    btn.textContent = '✓ 추가됨';
    btn.style.background = '#10b981'; btn.style.color = '#fff';
    await loadRestaurants();
  } catch (e) {
    btn.disabled = false; btn.textContent = '추가';
    alert('실패: ' + e.message);
  }
}

// ───────── 점심 모집 ─────────
function formatMeetTime(iso) {
  const dt = new Date(iso);
  const today = new Date(); today.setHours(0,0,0,0);
  const meetDay = new Date(dt); meetDay.setHours(0,0,0,0);
  const dayDiff = Math.round((meetDay - today) / (24*60*60*1000));
  const hh = dt.getHours();
  const mm = String(dt.getMinutes()).padStart(2, '0');
  if (dayDiff === 0) return `오늘 ${hh}:${mm}`;
  if (dayDiff === 1) return `내일 ${hh}:${mm}`;
  return `${dt.getMonth()+1}/${dt.getDate()} ${hh}:${mm}`;
}

function openMeetupModal(restaurantId, name) {
  if (!USER.id) return alert('슬랙에서 /밥 으로 열어야 모집할 수 있어요');
  if (!USER.channel) return alert('이 링크는 채널에 공지를 보낼 수 없어요. 슬랙 채널에서 /밥 을 다시 입력해주세요.');
  meetupTarget = restaurantId;
  meetupSelectedTime = null;
  document.getElementById('meetupTitle').textContent = `🍽️ ${name} 같이 가요`;
  document.getElementById('meetupNote').value = '';
  document.getElementById('meetupTimeCustom').style.display = 'none';
  document.getElementById('meetupTimeCustom').value = '';
  // 과거 시간 비활성
  const now = new Date();
  document.querySelectorAll('#timeOptions button').forEach(b => {
    b.classList.remove('selected', 'disabled');
    if (b.dataset.time !== 'custom') {
      const [h, m] = b.dataset.time.split(':').map(Number);
      const slot = new Date(); slot.setHours(h, m, 0, 0);
      if (slot <= now) b.classList.add('disabled');
    }
  });
  document.getElementById('meetupModal').classList.add('show');
}

function closeMeetupModal() {
  document.getElementById('meetupModal').classList.remove('show');
}

document.querySelectorAll('#timeOptions button').forEach(b => {
  b.addEventListener('click', () => {
    if (b.classList.contains('disabled')) return;
    document.querySelectorAll('#timeOptions button').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected');
    if (b.dataset.time === 'custom') {
      document.getElementById('meetupTimeCustom').style.display = 'block';
      meetupSelectedTime = 'custom';
    } else {
      document.getElementById('meetupTimeCustom').style.display = 'none';
      const [h, m] = b.dataset.time.split(':').map(Number);
      const dt = new Date(); dt.setHours(h, m, 0, 0);
      meetupSelectedTime = dt.toISOString();
    }
  });
});

async function submitMeetup() {
  let meetAt = meetupSelectedTime;
  if (meetAt === 'custom') {
    const v = document.getElementById('meetupTimeCustom').value;
    if (!v) return alert('시간을 입력해주세요');
    meetAt = new Date(v).toISOString();
  }
  if (!meetAt) return alert('시간을 선택해주세요');
  const note = document.getElementById('meetupNote').value.trim();
  try {
    const res = await fetch('/api/meetups', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        restaurantId: meetupTarget, userId: USER.id, userName: USER.name,
        channelId: USER.channel, meetAt, note,
      }),
    });
    if (!res.ok) throw new Error((await res.json()).error || '실패');
    const id = meetupTarget;
    closeMeetupModal();
    await loadRestaurants();
    reopenById(id);
  } catch (e) { alert('실패: ' + e.message); }
}

async function joinMeetup(meetupId, btn) {
  if (!USER.id) return;
  btn.disabled = true;
  try {
    const res = await fetch(`/api/meetups/${meetupId}/join`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: USER.id, userName: USER.name }),
    });
    if (!res.ok) throw new Error((await res.json()).error || '실패');
    const id = openInfo && window._lastRestaurantId;
    await loadRestaurants();
    if (id) reopenById(id);
  } catch (e) { btn.disabled = false; alert('실패: ' + e.message); }
}

async function leaveMeetup(meetupId, btn) {
  if (!USER.id) return;
  btn.disabled = true;
  try {
    const res = await fetch(`/api/meetups/${meetupId}/leave`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: USER.id }),
    });
    if (!res.ok) throw new Error((await res.json()).error || '실패');
    const id = window._lastRestaurantId;
    await loadRestaurants();
    if (id) reopenById(id);
  } catch (e) { btn.disabled = false; alert('실패: ' + e.message); }
}

// 식당 전체 리뷰 보기
async function showAllReviews(restaurantId) {
  const target = document.getElementById('reviews-' + restaurantId);
  const more = document.querySelector(`[onclick="showAllReviews(${restaurantId})"]`);
  if (!target) return;
  target.innerHTML = '<div style="font-size:11px;color:#888;padding:6px 0">불러오는 중…</div>';
  if (more) more.style.display = 'none';
  try {
    const res = await fetch(`/api/reviews/${restaurantId}`);
    const reviews = await res.json();
    if (!reviews.length) {
      target.innerHTML = '<div style="font-size:12px;color:#888">아직 리뷰가 없어요</div>';
      return;
    }
    target.innerHTML = `<div class="review-list">${reviews.map(rv => `
      <div class="review-item">
        <div><span class="stars">${'⭐'.repeat(rv.rating || 0)}</span>${rv.comment ? ' "' + esc(rv.comment) + '"' : ''}</div>
        <div class="who">— ${esc(rv.slack_user_name || '익명')}${rv.tags && rv.tags.length ? '<span class="tags">' + rv.tags.join(' ') + '</span>' : ''}</div>
      </div>`).join('')}</div>`;
  } catch (e) {
    target.innerHTML = '<div style="color:#dc2626;font-size:12px">불러오기 실패</div>';
    if (more) more.style.display = '';
  }
}

// 다른 가게로 이동
function selectById(id) {
  const idx = (window._filtered || restaurants).findIndex(r => r.id === id);
  if (idx < 0) return;
  const r = (window._filtered || restaurants)[idx];
  map.panTo(new kakao.maps.LatLng(r.latitude, r.longitude));
  openMarker(idx);
}

async function visit(restaurantId, btn) {
  if (!USER.id) return alert('슬랙에서 /밥 지도 명령으로 열어야 체크인할 수 있어요');
  btn.disabled = true;
  btn.textContent = '저장 중…';
  try {
    const res = await fetch('/api/visit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        restaurantId, userId: USER.id, userName: USER.name, channelId: USER.channel,
      }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || '실패');
    const msgs = ['✅ 방문 기록 완료!'];
    if (data.isFirstDiscoverer) msgs.push('🏴 첫 발견자!');
    if (data.isRegular) msgs.push(`👑 단골 (${data.userVisitCount}회)`);
    const toast = document.getElementById('toast-' + restaurantId);
    if (toast) toast.textContent = msgs.join(' · ');
    // 데이터 새로고침 후 같은 식당 InfoWindow 다시 열기
    await loadRestaurants();
    reopenById(restaurantId);
    // 첫 체크인 후 자동으로 리뷰 모달 띄우기 (이미 리뷰 있으면 패스)
    const r = restaurants.find(x => x.id === restaurantId);
    if (r && !r.my_review) {
      setTimeout(() => openReview(restaurantId, r.name), 350);
    }
  } catch (e) {
    btn.disabled = false;
    alert('실패: ' + e.message);
  }
}

async function cancelVisit(restaurantId, btn) {
  if (!USER.id) return;
  if (!confirm('가장 최근 체크인 1건을 취소할까요?')) return;
  btn.disabled = true;
  btn.textContent = '취소 중…';
  try {
    const res = await fetch('/api/visit/cancel', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ restaurantId, userId: USER.id }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || '실패');
    if (!data.canceled) throw new Error('취소할 체크인이 없어요');
    await loadRestaurants();
    reopenById(restaurantId);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '취소 ↩';
    alert('실패: ' + e.message);
  }
}

async function hideRestaurant(restaurantId, btn) {
  if (!confirm('이 식당을 망원밥에서 퇴출할까요?\n(배달 전문 등 찾아갈 수 없는 곳)\n\n복구하려면 DB에서 직접 hidden=false로 바꿔야 합니다.')) return;
  btn.disabled = true;
  try {
    const res = await fetch('/api/hide', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ restaurantId }),
    });
    if (!res.ok) throw new Error((await res.json()).error || 'failed');
    if (openInfo) openInfo.close();
    openInfo = null;
    await loadRestaurants();
  } catch (e) {
    btn.disabled = false;
    alert('실패: ' + e.message);
  }
}

// 식당 ID로 InfoWindow 재오픈
function reopenById(restaurantId) {
  const list = window._filtered || restaurants;
  const idx = list.findIndex(r => r.id === restaurantId);
  if (idx < 0) return;
  openMarker(idx);
}

function openReview(restaurantId, name) {
  reviewTarget = restaurantId;
  reviewRating = 0;
  // 기존 리뷰가 있으면 prefill
  const r = restaurants.find(x => x.id === restaurantId);
  const existing = r && r.my_review;
  document.getElementById('reviewTitle').textContent =
    existing ? `${name} 리뷰 수정` : `${name} 리뷰`;
  document.getElementById('reviewComment').value = existing?.comment || '';
  const tagSet = new Set(existing?.tags || []);
  document.querySelectorAll('#reviewTags input').forEach(c => {
    c.checked = tagSet.has(c.value);
  });
  setStars(existing?.rating || 0);
  document.getElementById('reviewModal').classList.add('show');
}

function closeReview() {
  document.getElementById('reviewModal').classList.remove('show');
}

function setStars(v) {
  reviewRating = v;
  document.querySelectorAll('#stars span').forEach(s => {
    s.classList.toggle('on', parseInt(s.dataset.v, 10) <= v);
  });
}

document.querySelectorAll('#stars span').forEach(s => {
  s.addEventListener('click', () => setStars(parseInt(s.dataset.v, 10)));
});

// 모바일 — 사이드바 헤더 탭하면 펼침/접힘 토글
document.querySelector('#sidebar header').addEventListener('click', (e) => {
  // 검색창 클릭은 제외
  if (e.target.tagName === 'INPUT') return;
  document.getElementById('sidebar').classList.toggle('expanded');
});

// 검색창에 입력하면 자동으로 펼침
document.getElementById('search').addEventListener('focus', () => {
  document.getElementById('sidebar').classList.add('expanded');
});

async function submitReview() {
  if (!reviewRating) return alert('별점을 선택해주세요');
  const comment = document.getElementById('reviewComment').value.trim();
  const tags = Array.from(document.querySelectorAll('#reviewTags input:checked')).map(c => c.value);
  try {
    const res = await fetch('/api/review', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        restaurantId: reviewTarget, userId: USER.id, userName: USER.name,
        rating: reviewRating, comment, tags,
      }),
    });
    if (!res.ok) throw new Error((await res.json()).error || 'failed');
    const id = reviewTarget;
    closeReview();
    await loadRestaurants();
    reopenById(id);
  } catch (e) {
    alert('실패: ' + e.message);
  }
}

// 식당 상태/인기/평점 → 마커 스타일
function getMarkerStyle(r) {
  if (!r.discovered) {
    // 속이 빈 보라색 원 — 회색 지도 위에서도 잘 보이고 "미탐험" 의미 명확
    return { color: '#a78bfa', size: 22, emoji: '?', glow: false, ring: null, hollow: true };
  }
  const rating = parseFloat(r.avg_rating) || 0;
  const visits = r.visit_count || 0;

  // 기본 (탐험 완료)
  let style = { color: '#f59e0b', size: 34, emoji: categoryEmoji(r.category), glow: false, ring: null, hollow: false };
  // 단골 인기 (10회+)
  if (visits >= 10) { style.size = 44; style.color = '#ef4444'; style.glow = true; style.ring = '🔥'; }
  // 별점 우수 (4.5+)
  if (rating >= 4.5 && visits >= 3) { style.size = Math.max(style.size, 40); style.glow = true; style.ring = '⭐'; }
  return style;
}

// 직접 단순화한 카테고리 → 이모지
function categoryEmoji(cat) {
  cat = cat || '';
  if (/한식|국밥|국수|찌개|찜|족발|보쌈|쌈/.test(cat)) return '🍚';
  if (/일식|초밥|스시|라멘|돈까스|우동|텐동/.test(cat)) return '🍣';
  if (/중식|짜장|마라/.test(cat)) return '🥢';
  if (/양식|파스타|피자|버거|스테이크|이탈리|프렌치/.test(cat)) return '🍕';
  if (/카페|커피|디저트|베이커리|빵|티/.test(cat)) return '☕';
  if (/술집|호프|바|이자카야|와인|맥주/.test(cat)) return '🍺';
  if (/분식|떡볶이|김밥/.test(cat)) return '🌶️';
  if (/치킨/.test(cat)) return '🍗';
  if (/고기|구이|곱창/.test(cat)) return '🥩';
  if (/아시아|쌀국수|태국|베트남/.test(cat)) return '🍜';
  return '🍴';
}

// SVG 마커 — 글로우/인기 링 표현
function makeMarker(style) {
  const { color, size, emoji, glow, ring, hollow } = style;
  const cx = size / 2;
  const cy = size / 2;
  const r = size / 2 - 3;

  const filterDef = glow ? `
    <defs><filter id="g${size}${color.replace('#','')}" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter></defs>` : '';
  const filterAttr = glow ? `filter="url(#g${size}${color.replace('#','')})"` : '';

  // 속 빈 마커: 흰 배경 + 진한 외곽선 / 일반 마커: 색 채움 + 흰 외곽선
  const fill = hollow ? 'white' : color;
  const stroke = hollow ? color : 'white';
  const strokeWidth = hollow ? 3 : 2.5;
  const textColor = hollow ? color : 'inherit';

  const text = emoji
    ? `<text x="${cx}" y="${cy + size * 0.16}" text-anchor="middle" font-size="${size * 0.55}" font-weight="bold" fill="${textColor}" dominant-baseline="middle">${emoji}</text>`
    : '';

  const ringSvg = ring ? `
    <circle cx="${size - 6}" cy="6" r="7" fill="white" stroke="${color}" stroke-width="1.5"/>
    <text x="${size - 6}" y="9" text-anchor="middle" font-size="9">${ring}</text>` : '';

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${filterDef}
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" ${filterAttr}/>
    ${text}
    ${ringSvg}
  </svg>`;

  return new kakao.maps.MarkerImage(
    'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg))),
    new kakao.maps.Size(size, size),
    { offset: new kakao.maps.Point(cx, cy) }
  );
}

// 회사 → 식당까지 점선 경로 표시
function drawRoute(r) {
  clearRoute();
  routeLine = new kakao.maps.Polyline({
    path: [
      new kakao.maps.LatLng(OFFICE.y, OFFICE.x),
      new kakao.maps.LatLng(r.latitude, r.longitude),
    ],
    strokeWeight: 4,
    strokeColor: '#10b981',
    strokeOpacity: 0.7,
    strokeStyle: 'shortdash',
  });
  routeLine.setMap(map);
}

function clearRoute() {
  if (routeLine) { routeLine.setMap(null); routeLine = null; }
}

// 카카오 외부 길찾기 URL (도보)
function kakaoDirectionsUrl(r) {
  const params = new URLSearchParams({
    sName: '월드컵로13길 19-25', sX: OFFICE.x, sY: OFFICE.y,
    eName: r.name, eX: r.longitude, eY: r.latitude,
    target: 'walk',
  });
  return `https://map.kakao.com/?${params.toString()}`;
}

// Haversine (m)
function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function formatDist(m) {
  if (!m && m !== 0) return '';
  return `도보 ${Math.max(1, Math.round(m / 80))}분`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
