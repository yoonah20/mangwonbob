# api.slack.com/apps → Create New App → From a manifest 에 붙여 넣으세요.
display_information:
  name: 망원밥
  description: 망원동에서 아직 안 가 본 저녁 밥집을 골라 줘요
  background_color: "#141a24"
features:
  bot_user:
    display_name: 망원밥
    always_online: true
  slash_commands:
    - command: /밥
      description: 오늘 가 볼 만한 새 밥집 세 곳
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
